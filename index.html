<!DOCTYPE html>
<html>
<link rel="stylesheet" href="style.css">

<head>
    <title></title>
</head>

<body>

    <header class="header">
        <h1 class="header__title">Car Rental System</h1>
    </header>

    <main class="layout">

        <!-- Sidebar Navigation -->
        <nav class="sidebar">

            <button class="sidebar__button" id="btnAddCar">
                <span class="sidebar__icon">🚗</span>
                <span class="sidebar__text">+</span>
            </button>

            <button class="sidebar__button" id="btnAddCustomer">
                <span class="sidebar__icon">👤</span>
                <span class="sidebar__text">+</span>
            </button>

        </nav>

        <!-- Filters -->
        <aside class="filter">

            <h2 class="filter__title">Search</h2>

            <div class="filter__group">
                <label class="filter__label" for="brand">Brand</label>
                <select class="filter__select" id="brand">
                    <option>All brands</option>
                </select>
            </div>

            <div class="filter__group">
                <label class="filter__label" for="model">Model</label>
                <select class="filter__select" id="model">
                    <option>All models</option>
                </select>
            </div>

            <div class="filter__group">
                <label class="filter__label" for="price">Maximum price/day</label>
                <input class="filter__input" type="number" id="price">
            </div>

            <div class="filter__group">
                <label class="filter__label" for="year">Minimum year</label>
                <input class="filter__input" type="number" id="year">
            </div>

            <button class="filter__button">
                Search
            </button>

        </aside>

        <!-- Cars -->
        <section class="cars">

            <div class="cars__grid" id="cars__grid">

                <article class="car-card">

                    <div class="car-card__image">
                        <img src="images/alfa.png" alt="Avatar" style="width:100%">
                    </div>

                    <div class="car-card__body">
                        <div class="car-card__info">
                            <h3 class="car-card__title">
                                Volvo XC60
                            </h3>

                            <p class="car-card__year">
                                2023
                            </p>
                        </div>
                        <div class="car-card__pricing">
                            <p class="car-card__hour-price">
                                €15 / hour
                            </p>

                            <p class="car-card__day-price">
                                €95 / day
                            </p>
                        </div>


                    </div>

                </article>

                <!-- More car cards -->

                <article class="car-card">

                    <div class="car-card__image"><img src="images/bmw.png" alt="Avatar" style="width:100%"></div>

                    <div class="car-card__body">
                        <div class="car-card__info">
                            <h3 class="car-card__title">
                                Volvo XC60
                            </h3>

                            <p class="car-card__year">
                                2023
                            </p>
                        </div>
                        <div class="car-card__pricing">
                            <p class="car-card__hour-price">
                                €15 / hour
                            </p>

                            <p class="car-card__day-price">
                                €95 / day
                            </p>
                        </div>


                    </div>

                </article>

                <article class="car-card">

                    <div class="car-card__image">
                        <img src="images/alfa.png" alt="Avatar" style="width:100%">
                    </div>

                    <div class="car-card__body">
                        <div class="car-card__info">
                            <h3 class="car-card__title">
                                Volvo XC60
                            </h3>

                            <p class="car-card__year">
                                2023
                            </p>
                        </div>
                        <div class="car-card__pricing">
                            <p class="car-card__hour-price">
                                €15 / hour
                            </p>

                            <p class="car-card__day-price">
                                €95 / day
                            </p>
                        </div>


                    </div>

                </article>

                <article class="car-card">

                    <div class="car-card__image"><img src="images/bmw.png" alt="Avatar" style="width:100%"></div>

                    <div class="car-card__body">
                        <div class="car-card__info">
                            <h3 class="car-card__title">
                                Volvo XC60
                            </h3>

                            <p class="car-card__year">
                                2023
                            </p>
                        </div>
                        <div class="car-card__pricing">
                            <p class="car-card__hour-price">
                                €15 / hour
                            </p>

                            <p class="car-card__day-price">
                                €95 / day
                            </p>
                        </div>


                    </div>

                </article>


            </div>

        </section>

        <div class="modal hidden" id="carModal">
            <div class="modal__content">
                <button class="modal__btn" id="btnCloseModal">Close</button>
                <button class="hidden" id="btnDeleteCar">Delete</button>
                <h2 class="modal__header" id="modalHeader">Add car</h2>

                <form action="" class="modal__form" id="carForm">
                    <input type="text" name="registration" class="modal__input" placeholder="Registration"
                        id="input-registration">
                    <input type="text" name="brand" class="modal__input" placeholder="Brand" id="input-brand">
                    <input type="text" name="model" class="modal__input" placeholder="Model" id="input-model">
                    <input type="text" name="imgUrl" class="modal__input" placeholder="img url" id="input-img-url">
                    <input type="number" name="year" class="modal__input" placeholder="Year" id="input-year">
                    <input type="number" name="priceDay" class="modal__input" placeholder="Price/day"
                        id="input-price-day">
                    <input type="number" name="priceHour" class="modal__input" placeholder="Price/hour"
                        id="input-price-hour">
                    <button type="submit" id="btnSaveCar">Save</button>
                </form>

            </div>
        </div>


        <div class="modal hidden" id="customerModal">
            <div class="modal__content">

                <button class="modal__btn" id="btnCloseCustomerModal">
                    Close
                </button>

                <h2 class="modal__header" id="customerModalHeader">
                    Add Customer
                </h2>

                <form class="modal__form" id="customerForm">

                    <input type="text" name="firstName" id="input-first-name" class="modal__input"
                        placeholder="First name">

                    <input type="text" name="lastName" id="input-last-name" class="modal__input"
                        placeholder="Last name">

                    <input type="email" name="email" id="input-email" class="modal__input" placeholder="Email">

                    <input type="tel" name="phone" id="input-phone" class="modal__input" placeholder="Phone number">

                    <input type="text" name="licenseNumber" id="input-license-number" class="modal__input"
                        placeholder="Driver's license number">

                    <button type="submit" id="btnSaveCustomer">
                        Save
                    </button>

                    <button type="button" id="btnDeleteCustomer" class="hidden">
                        Delete
                    </button>

                </form>

            </div>
        </div>

    </main>
    <script type="module" src="js/main.js"></script>
</body>

</html>
