<!DOCTYPE html>
<html>
<link rel="stylesheet" href="style.css">

<head>
    <title></title>
</head>

<body>

    <header class="header">
        <h1 class="header__title">Car Rental System</h1>
    </header>

    <main class="layout">

        <!-- Sidebar Navigation -->
        <nav class="sidebar">

            <button class="sidebar__button" id="btn-addCar">
                <span class="sidebar__icon">🚗</span>
                <span class="sidebar__text">+</span>
            </button>

            <button class="sidebar__button">
                <span class="sidebar__icon">👤</span>
                <span class="sidebar__text">+</span>
            </button>

        </nav>

        <!-- Filters -->
        <aside class="filter">

            <h2 class="filter__title">Search</h2>

            <div class="filter__group">
                <label class="filter__label" for="brand">Brand</label>
                <select class="filter__select" id="brand">
                    <option>All brands</option>
                </select>
            </div>

            <div class="filter__group">
                <label class="filter__label" for="model">Model</label>
                <select class="filter__select" id="model">
                    <option>All models</option>
                </select>
            </div>

            <div class="filter__group">
                <label class="filter__label" for="price">Maximum price/day</label>
                <input class="filter__input" type="number" id="price">
            </div>

            <div class="filter__group">
                <label class="filter__label" for="year">Minimum year</label>
                <input class="filter__input" type="number" id="year">
            </div>

            <button class="filter__button">
                Search
            </button>

        </aside>

        <!-- Cars -->
        <section class="cars">

            <div class="cars__grid" id="cars__grid">

                <article class="car-card">

                    <div class="car-card__image"> 
                        <img src="images/alfa.png" alt="Avatar" style="width:100%">
                    </div>

                    <div class="car-card__body">
                        <div class="car-card__info">
                        <h3 class="car-card__title">
                            Volvo XC60
                        </h3>

                        <p class="car-card__year">
                            2023
                        </p>
                    </div>
                        <div class="car-card__pricing">
                            <p class="car-card__hour-price">
                                €15 / hour
                            </p>

                            <p class="car-card__day-price">
                                €95 / day
                            </p>
                        </div>


                    </div>

                </article>

                <!-- More car cards -->

                <article class="car-card">

                    <div class="car-card__image"><img src="images/bmw.png" alt="Avatar" style="width:100%"></div>

                    <div class="car-card__body">
                        <div class="car-card__info">
                        <h3 class="car-card__title">
                            Volvo XC60
                        </h3>

                        <p class="car-card__year">
                            2023
                        </p>
                        </div>
                        <div class="car-card__pricing">
                            <p class="car-card__hour-price">
                                €15 / hour
                            </p>

                            <p class="car-card__day-price">
                                €95 / day
                            </p>
                        </div>


                    </div>

                </article>

                <article class="car-card">

                    <div class="car-card__image"> 
                        <img src="images/alfa.png" alt="Avatar" style="width:100%">
                    </div>

                    <div class="car-card__body">
                        <div class="car-card__info">
                        <h3 class="car-card__title">
                            Volvo XC60
                        </h3>

                        <p class="car-card__year">
                            2023
                        </p>
                    </div>
                        <div class="car-card__pricing">
                            <p class="car-card__hour-price">
                                €15 / hour
                            </p>

                            <p class="car-card__day-price">
                                €95 / day
                            </p>
                        </div>


                    </div>

                </article>

                <article class="car-card">

                    <div class="car-card__image"><img src="images/bmw.png" alt="Avatar" style="width:100%"></div>

                    <div class="car-card__body">
                        <div class="car-card__info">
                        <h3 class="car-card__title">
                            Volvo XC60
                        </h3>

                        <p class="car-card__year">
                            2023
                        </p>
                        </div>
                        <div class="car-card__pricing">
                            <p class="car-card__hour-price">
                                €15 / hour
                            </p>

                            <p class="car-card__day-price">
                                €95 / day
                            </p>
                        </div>


                    </div>

                </article>


            </div>

        </section>

        <div class="modal hidden" id="carModal">
            <div class="modal__content">
                <button class="modal__btn" id="btnCloseModal">Close</button>
                <h2 class="modal__header">Add car</h2>

                <form action="" class="modal__form">
                    <input type="text" name="" class="modal__input" placeholder="Registration" id="input-registration">
                    <input type="text" name="" class="modal__input" placeholder="Brand" id="input-brand">
                    <input type="text" name="" class="modal__input" placeholder="Model" id="input-model">
                    <input type="number" name="" class="modal__input" placeholder="Year" id="input-registration">
                    <input type="number" name="" class="modal__input" placeholder="Price/day" id="input-price-day">
                    <input type="number" name="" class="modal__input" placeholder="Price/hour" id="input-price-hour">
                </form>
                <button type="submit">Save</button>
            </div>
        </div>

    </main>
<script src="script.js"></script>
</body>

</html>
