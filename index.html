<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Rental</title>
</head>
<body>

    <header class="header">
        <h1 class="header__title">Car Rental</h1>
    </header>

    <main class="layout">

        <!-- Filter Sidebar -->
        <aside class="filter">

            <h2 class="filter__title">Filter</h2>

            <div class="filter__group">
                <label class="filter__label" for="brand">
                    Brand
                </label>
                <select class="filter__select" id="brand">
                    <option value="">All brands</option>
                </select>
            </div>

            <div class="filter__group">
                <label class="filter__label" for="model">
                    Model
                </label>
                <select class="filter__select" id="model">
                    <option value="">All models</option>
                </select>
            </div>

            <div class="filter__group">
                <label class="filter__label" for="price">
                    Price range
                </label>
                <input
                    class="filter__input"
                    type="number"
                    id="price"
                    placeholder="Max price"
                >
            </div>

            <div class="filter__group">
                <label class="filter__label" for="year">
                    Year
                </label>
                <input
                    class="filter__input"
                    type="number"
                    id="year"
                    placeholder="Minimum year"
                >
            </div>

            <button class="filter__button">
                Search
            </button>

        </aside>

        <!-- Cars -->
        <section class="cars">

            <div class="cars__grid">

                <article class="car-card">

                    <div class="car-card__image">

                    </div>

                    <div class="car-card__content">

                        <h3 class="car-card__title">
                            Volvo XC60
                        </h3>

                        <p class="car-card__year">
                            2023
                        </p>

                        <div class="car-card__prices">

                            <p class="car-card__price-hour">
                                €12 / hour
                            </p>

                            <p class="car-card__price-day">
                                €80 / day
                            </p>

                        </div>

                        <button class="car-card__button">
                            View Details
                        </button>

                    </div>

                </article>

                <!-- More car cards generated by JavaScript -->

            </div>

        </section>

    </main>

</body>
</html>
