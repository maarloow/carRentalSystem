<!DOCTYPE html>
<html>
<link rel="stylesheet" href="style.css">

<head>
    <title></title>
</head>

<body class="layout">

    <!--     <header class="header">
        <h1 class="header__title">Car Rental System</h1>
    </header> -->



    <!-- Sidebar Navigation -->
    <nav class="sidebar">

        <button class="sidebar__button" id="btnAddCar">
            <span class="sidebar__icon">🚗</span>
            <span class="sidebar__text">+</span>
        </button>

        <button class="sidebar__button" id="btnAddCustomer">
            <span class="sidebar__icon">👤</span>
            <span class="sidebar__text">+</span>
        </button>

        <button class="sidebar__button" id="btnShowCustomers">
            <span class="sidebar__icon">👤</span>
            <span class="sidebar__text"></span>
        </button>

        <button class="sidebar__button" id="btnShowCars">
            <span class="sidebar__icon">🚗</span>
            <span class="sidebar__text"></span>
        </button>

    </nav>


    <main id="app"></main>


    <div class="modal hidden" id="carModal">
        <div class="modal__content">

            <button class="modal__btn" id="btnCloseModal">
                Close
            </button>

            <button class="hidden" id="btnDeleteCar">
                Delete
            </button>

            <h2 class="modal__header" id="modalHeader">
                Add car
            </h2>

            <form action="" class="modal__form" id="carForm">

                <input type="text" name="registration" class="modal__input" placeholder="Registration"
                    id="input-registration">

                <input type="text" name="brand" class="modal__input" placeholder="Brand" id="input-brand">

                <input type="text" name="model" class="modal__input" placeholder="Model" id="input-model">

                <input type="text" name="imgUrl" class="modal__input" placeholder="img url" id="input-img-url">

                <input type="number" name="year" class="modal__input" placeholder="Year" id="input-year">

                <input type="number" name="priceDay" class="modal__input" placeholder="Price/day" id="input-price-day">

                <input type="number" name="priceHour" class="modal__input" placeholder="Price/hour" id="input-price-hour">

                <button type="submit" id="btnSaveCar">
                    Save
                </button>

            </form>

        </div>
    </div>


    <div class="modal hidden" id="customerModal">
        <div class="modal__content">

            <button class="modal__btn" id="btnCloseCustomerModal">
                Close
            </button>

            <h2 class="modal__header" id="customerModalHeader">
                Add Customer
            </h2>

            <form class="modal__form" id="customerForm">

                <input type="text" name="firstName" id="input-first-name" class="modal__input" placeholder="First name">

                <input type="text" name="lastName" id="input-last-name" class="modal__input" placeholder="Last name">

                <input type="email" name="email" id="input-email" class="modal__input" placeholder="Email">

                <input type="tel" name="phone" id="input-phone" class="modal__input" placeholder="Phone number">

                <input type="text" name="licenseNumber" id="input-license-number" class="modal__input"
                    placeholder="Driver's license number">

                <button type="submit" id="btnSaveCustomer">
                    Save
                </button>

                <button type="button" id="btnDeleteCustomer" class="hidden">
                    Delete
                </button>

            </form>

        </div>
    </div>


    <script type="module" src="js/main.js"></script>
</body>

</html>
